# Publishes the app to GitHub Pages on every push to main (after the tests pass).
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: npm test
      - name: Assemble the site (only what the app needs)
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons fonts _site/
          # The service worker's version is a fingerprint of what is published, not the commit: a merge
          # that changes none of these files (notes, tests, dev scripts) publishes the same sw.js, so
          # phones see no update and do not download or reload for nothing.
          VERSION=$(cd _site && find . -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -c1-16)
          test "${#VERSION}" -eq 16
          sed -i "s|^var VERSION = 'dev';.*|var VERSION = '${VERSION}';|" _site/sw.js
          grep -q "^var VERSION = '${VERSION}';$" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
